# Profile activated by BaseIntegrationTest. The datasource is supplied by the
# Testcontainers Postgres instance (@ServiceConnection) and the media
# directories by @DynamicPropertySource, so neither is configured here.

spring.docker.compose.enabled=false

# Dummy secrets - Google token verification is mocked in BaseIntegrationTest
spring.security.oauth2.client.registration.google.client-id=integration-test-client-id
spring.security.oauth2.client.registration.google.client-secret=integration-test-client-secret
app.security.jwt-secret=integration-test-jwt-secret-at-least-32-characters

frontend.url=http://localhost:5173
stream.max-length=28800

logging.level.com.ddf.vodsystem=DEBUG
